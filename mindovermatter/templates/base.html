{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mind Over Matter{% endblock %}</title>
<meta name="description" content="{% block description %}Student-run psychology education at Georgia Tech, Kennesaw State, and partner high schools.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/components.css' %}">
{% block extra_head %}{% endblock %}
</head>
<body>
{% include "_nav.html" %}
<main id="content">
  {% if messages %}
    <div class="shell">{% for m in messages %}<p class="notice">{{ m }}</p>{% endfor %}</div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
{% include "_footer.html" %}
</body>
</html>
